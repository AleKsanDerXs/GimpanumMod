plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id
// Имя джарки как у остальных модов сервера: gimpanum-1.21.1-<версия>.jar
base.archivesName = "${mod_id}-${minecraft_version}"

java {
    // NeoForge 21.1.x требует Java 21. Toolchain позволяет Gradle подтянуть её
    // самостоятельно, даже если в системе стоит только JDK 17.
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version

    // Игровые тесты (src/test) компилируются против того же NeoForge.
    addModdingDependenciesTo(sourceSets.test)

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            // Игровые тесты лежат в src/test и в джарку не попадают.
            sourceSet = sourceSets.test
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.test)
        }
    }
}

repositories {
    mavenCentral()
}

// --- Sable как локальная compileOnly-зависимость ---------------------------
// Sable не опубликован в публичном maven, поэтому берём джарку из модпака.
// Часть API (Pose3d/Pose3dc) лежит во вложенных jarjar-джарках, их надо
// распаковать. Если джарки нет — сборка обязана всё равно проходить, просто
// без поддержки sublevel'ов.
def sableJar = file("other_mods_in_modpack/sable-neoforge-1.21.1-${sable_version}.jar")
def sableDepsDir = layout.buildDirectory.dir('sable-deps')

def extractSableNestedJars = tasks.register('extractSableNestedJars', Copy) {
    onlyIf { sableJar.exists() }
    if (sableJar.exists()) {
        from(zipTree(sableJar)) {
            include 'META-INF/jarjar/sable-companion-common-*.jar'
            include 'META-INF/jarjar/veil-*.jar'
        }
    }
    eachFile { it.relativePath = new RelativePath(true, it.name) }
    includeEmptyDirs = false
    into sableDepsDir
}

// FTB Teams — тоже необязательная зависимость, тоже из модпака. ftb-library и
// architectury нужны лишь для того, чтобы javac разрешил сигнатуры TeamManager.
def ftbJars = files(
        "other_mods_in_modpack/ftb-teams-neoforge-${ftb_teams_version}.jar",
        "other_mods_in_modpack/ftb-library-neoforge-${ftb_library_version}.jar",
        "other_mods_in_modpack/architectury-${architectury_version}-neoforge.jar"
).filter { it.exists() }

// Xaero's Minimap — метки конвертеров на карте. Публичного API у мода нет,
// поэтому мост ходит по внутренним классам и обязан переживать их исчезновение.
def xaeroJar = file("other_mods_in_modpack/xaerominimap-neoforge-${minecraft_version}-${xaero_minimap_version}.jar")

// Create Big Cannons — Яростный снаряд наследует их снаряд, поэтому это
// единственная зависимость мода, без которой часть содержимого не появится.
// Create и Ritchie's Projectile Library нужны лишь затем, чтобы javac
// разрешил сигнатуры, унаследованные снарядом.
def cbcJars = files(
        "other_mods_in_modpack/createbigcannons-${cbc_version}.jar",
        "other_mods_in_modpack/create-${minecraft_version}-${create_version}.jar",
        "other_mods_in_modpack/ritchiesprojectilelib-${rpl_version}-neoforge.jar"
).filter { it.exists() }

// JEI — просмотрщик рецептов. Нужен только затем, чтобы показать все возможные
// находки Замороженной органики: у неё случайный выход, и обычная запись
// рецепта врала бы одним предметом. Без JEI мод работает полностью, просто
// показывать находки негде.
def jeiJar = file("other_mods_in_modpack/jei-${minecraft_version}-neoforge-${jei_version}.jar")

dependencies {
    if (sableJar.exists()) {
        compileOnly files(sableJar)
        compileOnly fileTree(dir: sableDepsDir, include: '*.jar').builtBy(extractSableNestedJars)
    } else {
        logger.lifecycle("Sable jar not found at ${sableJar} — building without sublevel support.")
    }

    if (!ftbJars.isEmpty()) {
        compileOnly ftbJars
    } else {
        logger.lifecycle("FTB Teams jars not found — building without team support.")
    }

    if (!cbcJars.isEmpty()) {
        compileOnly cbcJars
    } else {
        logger.lifecycle("Create Big Cannons jars not found — building without the Furious Shell.")
    }

    if (jeiJar.exists()) {
        compileOnly files(jeiJar)
    } else {
        logger.lifecycle("JEI jar not found at ${jeiJar} — building without the thawing recipe screen.")
    }

    if (xaeroJar.exists()) {
        compileOnly files(xaeroJar)
    } else {
        logger.lifecycle("Xaero's Minimap jar not found at ${xaeroJar} — building without map markers.")
    }
}

// Подстановка версий из gradle.properties в neoforge.mods.toml
tasks.named('processResources', ProcessResources).configure {
    // Без этого expand читает ресурсы в кодировке платформы и портит кириллицу.
    filteringCharset = 'UTF-8'

    def expandProps = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]

    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand expandProps
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Готовая джарка копируется в ../dist — оттуда её берут на сервер.
tasks.register('dist', Copy) {
    from tasks.named('jar')
    into layout.projectDirectory.dir('../dist')
}
tasks.named('assemble') {
    finalizedBy 'dist'
}

// Каждый прогон игровых тестов начинается с чистого мира: указатели мода сохраняются на диск.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        delete(layout.projectDirectory.dir('run/world'))
    }
}
